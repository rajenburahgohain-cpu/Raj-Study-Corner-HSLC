name: Build Assamese Sahayika APK and AAB (Signed Play Build)

"on":
  workflow_dispatch:
    inputs:
      create_new_upload_key:
        description: "Create a new upload key only for first setup"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'README*'
      - 'premium_ads_setup.sql'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
      ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CREATE_NEW_UPLOAD_KEY: ${{ inputs.create_new_upload_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate HTML
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qiE '<!doctype[[:space:]]+html|<html([[:space:]>])' index.html

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install --save-exact \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor-community/admob@6

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'CAPEOF'
          {
            "appId": "com.rbg.assamesesahayika",
            "appName": "Assamese Sahayika",
            "webDir": "www"
          }
          CAPEOF
          fi

          mkdir -p www
          cp index.html www/index.html

          for item in assets css js images; do
            if [ -e "$item" ]; then
              cp -R "$item" www/
            fi
          done

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configure Android API, minimum SDK, microphone and AdMob
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re, os, json, html

          variables = Path('android/variables.gradle')
          if not variables.exists():
              raise SystemExit('android/variables.gradle not found')

          s = variables.read_text(encoding='utf-8')
          s = re.sub(r'(compileSdkVersion\s*=\s*)\d+', r'\g<1>36', s)
          s = re.sub(r'(targetSdkVersion\s*=\s*)\d+', r'\g<1>36', s)

          s, count = re.subn(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>24', s)
          if count == 0:
              raise SystemExit('Could not update minSdkVersion in variables.gradle')
          variables.write_text(s, encoding='utf-8')

          check = re.search(r'minSdkVersion\s*=\s*(\d+)', s)
          if not check or int(check.group(1)) < 24:
              raise SystemExit('minSdkVersion must be 24 or higher')
          print('Verified minSdkVersion:', check.group(1))

          app_gradle = Path('android/app/build.gradle')
          if app_gradle.exists():
              s = app_gradle.read_text(encoding='utf-8')
              s = re.sub(r'(compileSdk\s*(?:=|\s)\s*)\d+', r'\g<1>36', s)
              s = re.sub(r'(targetSdk\s*(?:=|\s)\s*)\d+', r'\g<1>36', s)
              s = re.sub(r'(minSdk\s*=\s*)\d+', r'\g<1>24', s)
              s = re.sub(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>24', s)
              app_gradle.write_text(s, encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text(encoding='utf-8')
          root = re.search(r'<manifest\b[^>]*>', s)
          if not root:
              raise SystemExit('Android manifest root missing')

          for perm in ['android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS']:
              pat = r'<uses-permission\b[^>]*android:name="' + re.escape(perm) + r'"'
              if not re.search(pat, s):
                  s = s[:root.end()] + f'\n    <uses-permission android:name="{perm}" />' + s[root.end():]
                  root = re.search(r'<manifest\b[^>]*>', s)

          test_app = 'ca-app-pub-3940256099942544~3347511713'
          app_id = (os.getenv('ADMOB_APP_ID') or '').strip() or test_app
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />'
          pat = r'<meta-data\b(?=[^>]*android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID")[^>]*/?>'

          if re.search(pat, s):
              s = re.sub(pat, meta, s, count=1)
          else:
              app = re.search(r'<application\b[^>]*>', s)
              if not app:
                  raise SystemExit('Android application tag missing')
              s = s[:app.end()] + '\n        ' + meta + s[app.end():]
          manifest.write_text(s, encoding='utf-8')

          strings = Path('android/app/src/main/res/values/strings.xml')
          strings.parent.mkdir(parents=True, exist_ok=True)
          x = strings.read_text(encoding='utf-8') if strings.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          item = '<string name="admob_app_id">' + html.escape(app_id, quote=True) + '</string>'
          pat = r'<string\s+name="admob_app_id">.*?</string>'

          if re.search(pat, x, re.S):
              x = re.sub(pat, item, x, flags=re.S)
          elif '</resources>' in x:
              x = x.replace('</resources>', '    ' + item + '\n</resources>')
          else:
              raise SystemExit('strings.xml invalid')
          strings.write_text(x, encoding='utf-8')

          banner = (os.getenv('ADMOB_BANNER_UNIT_ID') or '').strip() or 'ca-app-pub-3940256099942544/6300978111'
          inter = (os.getenv('ADMOB_INTERSTITIAL_UNIT_ID') or '').strip() or 'ca-app-pub-3940256099942544/1033173712'
          using_test = not all([(os.getenv('ADMOB_APP_ID') or '').strip(), (os.getenv('ADMOB_BANNER_UNIT_ID') or '').strip(), (os.getenv('ADMOB_INTERSTITIAL_UNIT_ID') or '').strip()])

          Path('www/admob-config.js').write_text(
              'window.ASSAMESE_SAHAYIKA_ADMOB = ' + json.dumps({
                  'bannerAdUnitId': banner,
                  'interstitialAdUnitId': inter,
                  'usingTestIds': using_test
              }) + ';\n',
              encoding='utf-8'
          )
          print('Android permissions and AdMob configuration prepared.')
          print('Test Ad IDs active:', using_test)
          PY

      - name: Configure Play Store signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
              echo "::error::All signing secrets are required."
              exit 1
            fi

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            test -s android/app/release.keystore
            keytool -list -keystore android/app/release.keystore -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo 'generated_keystore=false' >> "$GITHUB_OUTPUT"
            echo 'Using saved signing key.'
          else
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || [ "${CREATE_NEW_UPLOAD_KEY:-false}" != "true" ]; then
              echo "::error::KEYSTORE_BASE64 is missing."
              echo "::error::For first setup, manually run this workflow and select create_new_upload_key=true."
              exit 1
            fi

            if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
              echo "::error::Set KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in GitHub Secrets first."
              exit 1
            fi

            if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
              echo "::error::For a new PKCS12 key, KEY_PASSWORD must equal KEYSTORE_PASSWORD."
              exit 1
            fi

            keytool -genkeypair -noprompt -v -keystore android/app/release.keystore -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname 'CN=Assamese Sahayika, OU=App, O=RBG Study Corner, L=Guwahati, ST=Assam, C=IN'
            keytool -list -keystore android/app/release.keystore -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:KEYSTORE_PASSWORD -in android/app/release.keystore -out "$RUNNER_TEMP/release-keystore.enc"
            base64 -w 0 android/app/release.keystore > "$RUNNER_TEMP/release-keystore.base64"
            echo 'generated_keystore=true' >> "$GITHUB_OUTPUT"
            echo 'First signing key generated and verified.'
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          start = '// BEGIN ASSAMESE SAHAYIKA SIGNING CONFIG'
          end = '// END ASSAMESE SAHAYIKA SIGNING CONFIG'
          s = re.sub(re.escape(start) + r'.*?' + re.escape(end) + r'\s*', '', s, flags=re.S)
          block = '''
          // BEGIN ASSAMESE SAHAYIKA SIGNING CONFIG
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          // END ASSAMESE SAHAYIKA SIGNING CONFIG
          '''
          p.write_text(s.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')
          PY

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build Release AAB
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon bundleRelease

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"
          echo 'AAB signature verified.'

      - name: Upload APK and AAB artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Assamese-Sahayika-APK-AAB-SIGNED
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload first-time signing key setup
        if: always() && steps.signing.outputs.generated_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Assamese-Sahayika-Key-Setup
          path: |
            ${{ runner.temp }}/release-keystore.base64
            ${{ runner.temp }}/release-keystore.enc
          if-no-files-found: error
          retention-days: 1
