<!doctype html><html lang="as"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অসমীয়া সহায়িকা — একাউণ্ট মচা</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:24px auto;padding:0 16px;line-height:1.6}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;font-size:16px}button{background:#176b3a;color:white;border:0;border-radius:8px}</style></head><body><h1>একাউণ্ট মচাৰ অনুৰোধ</h1><p>একাউণ্ট মচিবলৈ তলত একাউণ্টৰ ইমেইল আৰু পাছৱৰ্ড দি লগইন কৰক।</p><p><b>গুৰুত্বপূৰ্ণ:</b> GitHub Pages-ত এই পৃষ্ঠা publish আৰু Supabase-ত <code>delete-account</code> Edge Function deploy নকৰালৈ একাউণ্ট মচা কাম নকৰে।</p><label for="email">ইমেইল</label><input id="email" type="email" autocomplete="email"><label for="password">পাছৱৰ্ড</label><input id="password" type="password" autocomplete="current-password"><button id="delete">লগইন কৰি একাউণ্ট মচক</button><p id="status" role="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=window.supabase.createClient("https://rlmxfzdbipksbrikgfbs.supabase.co","sb_publishable_YbXRYD3badwrI6iUh3IFJg_k_efMjen");document.getElementById('delete').onclick=async()=>{const s=document.getElementById('status'),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){s.textContent='ইমেইল আৰু পাছৱৰ্ড দিয়ক।';return}if(!confirm('সঁচাকৈ একাউণ্ট মচিব বিচাৰে নেকি?'))return;s.textContent='লগইন কৰি থকা হৈছে…';const l=await client.auth.signInWithPassword({email,password});if(l.error){s.textContent='লগইন নহ’ল। তথ্য পৰীক্ষা কৰক।';return}const r=await client.functions.invoke('delete-account',{body:{confirm:true}});if(r.error){s.textContent='মচা সম্পূৰ্ণ নহ’ল। Server function পৰীক্ষা কৰিব লাগিব।';return}await client.auth.signOut();s.textContent='একাউণ্ট মচাৰ অনুৰোধ সফল হৈছে।'};</script></body></html>
