name: Build Assamese Sahayika APK and AAB (V65)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README*'
      - 'premium_ads_setup.sql'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
      ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate root HTML (prevents YAML being published as index.html)
        shell: bash
        run: |
          set -e
          test -s index.html || { echo '::error::Root index.html is missing or empty.'; exit 1; }
          grep -qiE '<!doctype[[:space:]]+html|<html([[:space:]>])' index.html || {
            echo '::error::Root index.html is not an HTML document. Put the YAML workflow only in .github/workflows/android-build.yml.'
            exit 1
          }
          echo 'Valid HTML entry file found.'

      - name: Validate Play signing secrets
        shell: bash
        run: |
          set -e
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Add all four signing secrets before building the Play Store AAB."
              exit 1
            fi
          done
          echo 'All four Play signing secrets are present.'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
            echo '::error::Android SDK sdkmanager not found on runner.'; exit 1;
          }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -e
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --save-exact @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'CAPEOF'
          {
            "appId": "com.rbg.assamesesahayika",
            "appName": "Assamese Sahayika",
            "webDir": "www"
          }
          CAPEOF
          fi
          mkdir -p www
          cp index.html www/index.html
          for item in assets css js images; do
            if [ -e "$item" ]; then cp -R "$item" www/; fi
          done
          if [ ! -d android ]; then npx cap add android; fi
          test -f android/app/src/main/AndroidManifest.xml || {
            echo '::error::AndroidManifest.xml was not generated by Capacitor. Check the Android platform setup.'; exit 1;
          }

      - name: Write AdMob runtime configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, json
          test_app = 'ca-app-pub-3940256099942544~3347511713'
          test_banner = 'ca-app-pub-3940256099942544/6300978111'
          test_interstitial = 'ca-app-pub-3940256099942544/1033173712'
          app = (os.getenv('ADMOB_APP_ID') or '').strip() or test_app
          banner = (os.getenv('ADMOB_BANNER_UNIT_ID') or '').strip() or test_banner
          interstitial = (os.getenv('ADMOB_INTERSTITIAL_UNIT_ID') or '').strip() or test_interstitial
          using_test = not all((
              (os.getenv('ADMOB_APP_ID') or '').strip(),
              (os.getenv('ADMOB_BANNER_UNIT_ID') or '').strip(),
              (os.getenv('ADMOB_INTERSTITIAL_UNIT_ID') or '').strip(),
          ))
          Path('www/admob-config.js').write_text(
              'window.ASSAMESE_SAHAYIKA_ADMOB = ' + json.dumps({
                  'bannerAdUnitId': banner,
                  'interstitialAdUnitId': interstitial,
                  'usingTestIds': using_test
              }) + ';\n', encoding='utf-8')
          Path('/tmp/admob_app_id.txt').write_text(app, encoding='utf-8')
          print('AdMob runtime configuration written. Test IDs active:', using_test)
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set Android API level to 36
        shell: bash
        run: |
          set -e
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          candidates = [Path('android/variables.gradle'), Path('android/app/build.gradle')]
          for path in candidates:
              if not path.exists(): continue
              text = path.read_text(encoding='utf-8')
              if path.name == 'variables.gradle':
                  text = re.sub(r'(compileSdkVersion\s*=\s*)\d+', r'\g<1>36', text)
                  text = re.sub(r'(targetSdkVersion\s*=\s*)\d+', r'\g<1>36', text)
              else:
                  text = re.sub(r'(compileSdk\s*(?:=| )\s*)\d+', r'\g<1>36', text)
                  text = re.sub(r'(targetSdk\s*(?:=| )\s*)\d+', r'\g<1>36', text)
              path.write_text(text, encoding='utf-8')
          text = '\n'.join(p.read_text(encoding='utf-8') for p in candidates if p.exists())
          if not re.search(r'compileSdkVersion\s*=\s*36|compileSdk\s*(?:=| )\s*36', text):
              raise SystemExit('::error::Could not set compileSdk to API 36.')
          if not re.search(r'targetSdkVersion\s*=\s*36|targetSdk\s*(?:=| )\s*36', text):
              raise SystemExit('::error::Could not set targetSdk to API 36.')
          print('compileSdk and targetSdk configured for Android API 36.')
          PYCODE

      - name: Set unique Play version code
        shell: bash
        run: |
          set -e
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          text = p.read_text(encoding='utf-8')
          code = 1000 + int(os.environ.get('GITHUB_RUN_NUMBER', '1'))
          text, count = re.subn(r'(?m)^(\s*versionCode\s+)\d+\s*$', rf'\g<1>{code}', text, count=1)
          if count != 1:
              raise SystemExit('::error::Could not set versionCode in android/app/build.gradle')
          text, count = re.subn(r'(?m)^(\s*versionName\s+)["\'][^"\']*["\']\s*$', rf'\g<1>"65.{code}"', text, count=1)
          if count != 1:
              raise SystemExit('::error::Could not set versionName in android/app/build.gradle')
          p.write_text(text, encoding='utf-8')
          print(f'Play versionCode set to {code}; versionName set to 65.{code}.')
          PYCODE

      - name: Configure Android permissions and AdMob App ID
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists(): raise SystemExit('::error::AndroidManifest.xml not found after Capacitor sync')
          content = manifest.read_text(encoding='utf-8')
          root = re.search(r'<manifest\b[^>]*>', content)
          app = re.search(r'<application\b[^>]*>', content)
          if not root or not app: raise SystemExit('::error::Manifest root/application tag missing')
          for permission in ('android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS'):
              pattern = r'<uses-permission\b[^>]*android:name="' + re.escape(permission) + r'"'
              if not re.search(pattern, content):
                  content = content[:root.end()] + f'\n    <uses-permission android:name="{permission}" />' + content[root.end():]
                  root = re.search(r'<manifest\b[^>]*>', content)
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />'
          if 'com.google.android.gms.ads.APPLICATION_ID' in content:
              content = re.sub(r'<meta-data\b(?=[^>]*android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID")[^>]*/?>', meta, content, count=1)
          else:
              app = re.search(r'<application\b[^>]*>', content)
              content = content[:app.end()] + '\n        ' + meta + content[app.end():]
          manifest.write_text(content, encoding='utf-8')
          strings = Path('android/app/src/main/res/values/strings.xml')
          strings.parent.mkdir(parents=True, exist_ok=True)
          sc = strings.read_text(encoding='utf-8') if strings.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          app_id = html.escape(Path('/tmp/admob_app_id.txt').read_text(encoding='utf-8').strip(), quote=True)
          item = f'<string name="admob_app_id">{app_id}</string>'
          if re.search(r'<string\s+name="admob_app_id">.*?</string>', sc, re.S):
              sc = re.sub(r'<string\s+name="admob_app_id">.*?</string>', item, sc, flags=re.S)
          elif '</resources>' in sc:
              sc = sc.replace('</resources>', f'    {item}\n</resources>')
          else: raise SystemExit('::error::strings.xml has no resources closing tag')
          strings.write_text(sc, encoding='utf-8')
          print('Manifest permissions and AdMob App ID configured.')
          PY

      - name: Verify native configuration
        shell: bash
        run: |
          set -e
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml
          grep -q 'admob_app_id' android/app/src/main/res/values/strings.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' android/app/src/main/AndroidManifest.xml
          test -s www/admob-config.js
          echo 'Android manifest, permissions, and AdMob runtime config verified.'

      - name: Configure Play Store signing (PKCS12)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore || { echo '::error::Decoded signing keystore is empty.'; exit 1; }
          cat >> android/app/build.gradle <<'GROOVY'
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storeType 'PKCS12'
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GROOVY
          echo 'PKCS12 release signing configured.'

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify signed release AAB
        shell: bash
        run: |
          set -e
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB" || { echo '::error::Release AAB not found.'; exit 1; }
          jarsigner -verify "$AAB" >/dev/null
          echo 'Release AAB signature verified.'

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Assamese-Sahayika-APK-AAB-Ads-Premium
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
